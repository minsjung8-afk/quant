name: fin

on:
  workflow_dispatch:
  schedule:
    - cron: "9 21 * * 6"     # 한국시간 일요일 06:09 — 주 1회 (DART 호출 없음, 본인 사이트에서만 읽음)

permissions:
  contents: write

concurrency:
  group: fin
  cancel-in-progress: false

jobs:
  fin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 심사참고 DB 사이트에서 재무 요약 수집
        run: python3 fetch_fin.py
      - name: 저장소에 반영
        if: always()
        run: |
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add data_fin 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "data: 재무 요약 $(date -u +%Y-%m-%d)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
